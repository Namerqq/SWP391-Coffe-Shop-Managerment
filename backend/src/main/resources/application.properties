spring.application.name=project
server.port=8080

# ===== MySQL =====
# Database chung của nhóm: cafe_management (tạo bằng database/V1__schema.sql + V2__reference_data.sql)
# Đổi user/password theo máy của bạn bằng biến môi trường DB_URL, DB_USER, DB_PASSWORD (không commit mật khẩu)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cafe_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}

# ===== JPA / Hibernate =====
# none: Hibernate KHÔNG tự tạo/sửa bảng. Schema chỉ thay đổi qua file migration V3__..., V4__... trong database/
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== CORS: địa chỉ frontend được phép gọi API =====
app.cors.allowed-origins=http://localhost:5173
