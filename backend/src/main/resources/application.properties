spring.application.name=cafe-shop
server.port=${PORT:8080}
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/cafe_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# Frozen schema: Flyway owns DDL. Hibernate must never add legacy product tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
app.cors.allowed-origins=${CAFE_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5184,http://127.0.0.1:5184,http://localhost:5185,http://127.0.0.1:5185}
server.servlet.session.cookie.name=CAFE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=8h
# Pricing policy until the team introduces a shared options catalog via a future migration.
app.ordering.large-size-price=${CAFE_LARGE_SIZE_PRICE:10000}
app.ordering.espresso-price=${CAFE_ESPRESSO_PRICE:10000}
app.ordering.milk-foam-price=${CAFE_MILK_FOAM_PRICE:10000}

# Iter 1: customer ordering uses one real table. Empty value restores QR selection.
app.ordering.fixed-table-qr=${CAFE_FIXED_TABLE_QR:T-08}

# Staff authentication belongs to the team authentication module, outside Iter 1.
app.ordering.staff-login-enabled=${CAFE_STAFF_LOGIN_ENABLED:false}
