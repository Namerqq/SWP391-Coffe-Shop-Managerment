spring.application.name=project
server.port=8080

# ===== MySQL =====
# Đổi user/password theo máy của bạn (hoặc đặt biến môi trường DB_USER, DB_PASSWORD)
spring.datasource.url=jdbc:mysql://localhost:3306/project_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}

# ===== JPA / Hibernate =====
# update: tự thêm bảng/cột còn thiếu (tiện khi dev). Khi làm thật nên dùng validate/none.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== CORS: địa chỉ frontend được phép gọi API =====
app.cors.allowed-origins=http://localhost:5173
