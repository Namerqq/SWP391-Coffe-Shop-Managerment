spring.application.name=project
server.port=8080

# ===== MySQL =====
# Đổi user/password theo máy của bạn (hoặc đặt biến môi trường DB_URL, DB_USER, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cafe_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}

# ===== JPA / Hibernate =====
# none: KHÔNG để Hibernate sửa schema. Bảng được tạo bằng các file database/V1, V2, V3...sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== CORS: địa chỉ frontend được phép gọi API =====
app.cors.allowed-origins=http://localhost:5173

# ===== Tài khoản Admin mặc định (chỉ tạo khi DB chưa có Admin nào) =====
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@cafeshop.local}
app.admin.password=${ADMIN_PASSWORD:123456}

# ===== Upload ảnh (ảnh trang chủ do Admin tải lên) =====
# Ảnh lưu trong thư mục này (tính từ thư mục chạy backend) và được phục vụ ở http://localhost:8080/uploads/...
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== payOS: thanh toán QR tự xác nhận (ThangNN) =====
# KHÔNG ghi key thật vào file này (file nằm trên Git). Lấy 3 key ở my.payos.vn > Kênh thanh toán rồi đặt
# biến môi trường PAYOS_CLIENT_ID, PAYOS_API_KEY, PAYOS_CHECKSUM_KEY (hoặc ghi vào file
# backend/application-default.properties, file này đã có trong .gitignore). Để trống = tắt QR payOS,
# thu ngân vẫn dùng được Tiền mặt và Chuyển khoản thủ công.
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.base-url=https://api-merchant.payos.vn
# payOS bắt buộc có 2 link này; khách quét QR bằng app ngân hàng thì không dùng tới.
app.payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/cashier}
app.payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/cashier}
# Khách đặt online (ThangNN Iter2): trả xong / hủy trên trang payOS thì quay về trang này của khách.
app.payos.online-return-url=${PAYOS_ONLINE_RETURN_URL:http://localhost:5173/online-pay/qr}
app.payos.online-cancel-url=${PAYOS_ONLINE_CANCEL_URL:http://localhost:5173/online-pay/qr}
# Backend tự hỏi payOS trạng thái các mã QR đang chờ mỗi bấy nhiêu mili giây
# (dự phòng khi webhook không tới được, vd backend chạy localhost).
app.payos.poll-interval-ms=3000
